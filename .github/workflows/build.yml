name: build

on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        device: [m32]
        ksu: [1]
    name: "🚧 Build for ${{matrix.device}} 

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: szenius/set-timezone@v2.0
        with:
          timezoneLinux: "Asia/Kolkata"

      - name: Setup Toolchains
        run: |
          sudo apt update
          sudo apt install bison flex libssl-dev libarchive-tools gcc-aarch64-linux-gnu g++-aarch64-linux-gnu -y
          echo 'Done'
          
      - name: Make build_kernel.sh executable
        run: |
          chmod +x build_kernel.sh

      - name: Run build
        run: |
          ./build_kernel.sh
